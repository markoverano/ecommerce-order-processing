global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "job", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "null"
  routes:
    - match:
        severity: critical
      receiver: ops-critical
    - match:
        severity: warning
      receiver: ops-warning

receivers:
  - name: "null"

  # Replace with real webhook, PagerDuty, Slack, etc. in production.
  - name: ops-critical
    webhook_configs:
      - url: "http://localhost:9999/alert"
        send_resolved: true

  - name: ops-warning
    webhook_configs:
      - url: "http://localhost:9999/alert"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "job"]
