---
# RabbitMQ: accepts connections from all services; inter-cluster on 4369/25672
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-netpol
  namespace: ecommerce-prod
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - order-service
                  - payment-service
                  - inventory-service
                  - shipping-service
                  - notification-service
                  - saga-orchestrator
      ports:
        - port: 5672
    # Management UI (internal only)
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - port: 15672
    # Inter-node clustering
    - from:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 4369
        - port: 25672
  egress:
    # Inter-node clustering
    - podSelector:
        matchLabels:
          app: rabbitmq
      ports:
        - port: 4369
        - port: 25672
---
# Redis: accepts connections from all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: ecommerce-prod
spec:
  podSelector:
