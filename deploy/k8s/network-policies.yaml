# Default-deny ingress and egress for all pods in ecommerce-prod.
# Explicit NetworkPolicy rules below open only the required paths.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS egress from all pods (CoreDNS on port 53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ecommerce-prod
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Kong API Gateway: ingress from load balancer, egress to all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-ingress
  namespace: ecommerce-prod
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
        - port: 8443
  egress:
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - order-service
              - payment-service
              - inventory-service
              - shipping-service
              - notification-service
              - saga-orchestrator
      ports:
        - port: 8080
---
# Order Service: receives from Kong, sends to RabbitMQ, Redis, PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-netpol
  namespace: ecommerce-prod
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - port: 8080
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - podSelector:
        matchLabels:
          app: rabbitmq
      ports:
        - port: 5672
    - podSelector:
        matchLabels:
          app: redis
      ports:
        - port: 6379
    - podSelector:
        matchLabels:
          app: postgres
      ports:
        - port: 5432
    - podSelector:
        matchLabels:
          app: jaeger
      ports:
        - port: 4318
---
# Payment Service: receives from Kong and RabbitMQ consumer, sends to Stripe (external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-netpol
  namespace: ecommerce-prod
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - port: 8080
  egress:
    - podSelector:
        matchLabels:
          app: rabbitmq
      ports:
        - port: 5672
    - podSelector:
        matchLabels:
          app: redis
      ports:
        - port: 6379
    - podSelector:
        matchLabels:
          app: postgres
      ports:
        - port: 5432
    - podSelector:
        matchLabels:
          app: jaeger
      ports:
        - port: 4318
    # Stripe external HTTPS
    - ports:
        - port: 443
---
