apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ecommerce-prod
  labels:
    app: notification-service
    app.kubernetes.io/part-of: ecommerce
data:
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: ecommerce
  Mailgun__BaseUrl: https://api.mailgun.net/v3/
  Mailgun__Domain: "replace_me.mailgun.org"
  Jaeger__Endpoint: http://jaeger:4318/v1/traces
  Serilog__MinimumLevel__Default: Information
---
# Replace all stringData values before deploying to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: ecommerce-prod
  labels:
    app: notification-service
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  ConnectionStrings__NotificationsDb: "Host=postgres;Port=5432;Database=notifications_db;Username=ecommerce;Password=changeme"
  RabbitMQ__Password: "changeme"
  Mailgun__ApiKey: "replace_me"
  Twilio__AccountSid: "replace_me"
  Twilio__AuthToken: "replace_me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce-prod
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: ecommerce
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: notification-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification-service
          image: REGISTRY/notification-service:IMAGE_TAG
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce-prod
  labels:
    app: notification-service
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: ecommerce-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
