# RabbitMQ 3-replica HA cluster using the built-in K8s peer discovery plugin.
# Replace erlang-cookie and admin-password in the Secret before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: ecommerce-prod
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  erlang-cookie: "replace_me_with_a_random_64_char_string"
  admin-password: "changeme"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: ecommerce-prod
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: ecommerce
data:
  rabbitmq.conf: |
    cluster_formation.peer_discovery_backend  = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host                = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type        = hostname
    cluster_formation.node_cleanup.only_log_warning = true
    cluster_partition_handling = autoheal
    vm_memory_high_watermark.relative = 0.8
    disk_free_limit.relative = 1.5
    loopback_users.guest = false
    listeners.tcp.default = 5672
    management.tcp.port = 15672
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_peer_discovery_k8s].
---
# Headless service provides stable DNS for cluster peer discovery.
# Each pod is reachable at rabbitmq-{0,1,2}.rabbitmq-nodes.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodes
  namespace: ecommerce-prod
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app: rabbitmq
  clusterIP: None
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
    - name: epmd
      port: 4369
    - name: inter-node
      port: 25672
---
# ClusterIP service for application connections — microservices connect to rabbitmq:5672.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ecommerce-prod
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: ecommerce-prod
  labels:
    app: rabbitmq
    app.kubernetes.io/part-of: ecommerce
spec:
  serviceName: rabbitmq-nodes
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 4369
              name: epmd
            - containerPort: 25672
              name: inter-node
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(MY_POD_NAME).rabbitmq-nodes.$(MY_POD_NAMESPACE).svc.cluster.local"
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: erlang-cookie
            - name: RABBITMQ_DEFAULT_USER
              value: ecommerce
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: admin-password
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, ping]
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, check_port_connectivity]
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 10
      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
# RabbitMQ peer discovery requires read access to Endpoints and Pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: ecommerce-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq
  namespace: ecommerce-prod
rules:
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq
  namespace: ecommerce-prod
subjects:
  - kind: ServiceAccount
    name: rabbitmq
    namespace: ecommerce-prod
roleRef:
  kind: Role
  name: rabbitmq
  apiGroup: rbac.authorization.k8s.io
