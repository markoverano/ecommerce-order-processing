# Replace the postgres password in the Secret before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce-prod
  labels:
    app: postgres
    app.kubernetes.io/part-of: ecommerce
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
---
# Init script creates all six service databases on first cluster start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ecommerce-prod
  labels:
    app: postgres
    app.kubernetes.io/part-of: ecommerce
data:
  init.sql: |
    CREATE DATABASE orders_db;
    CREATE DATABASE payments_db;
    CREATE DATABASE inventory_db;
    CREATE DATABASE shipping_db;
    CREATE DATABASE notifications_db;
    CREATE DATABASE saga_db;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ecommerce-prod
  labels:
    app: postgres
    app.kubernetes.io/part-of: ecommerce
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: ecommerce
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ecommerce
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: [pg_isready, -U, ecommerce]
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, ecommerce]
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce-prod
  labels:
    app: postgres
    app.kubernetes.io/part-of: ecommerce
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  clusterIP: None
